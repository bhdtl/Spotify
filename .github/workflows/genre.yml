name: Genre-Zuordnung

on:
  workflow_dispatch:  # manuell im Actions-Tab starten

jobs:
  genre:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zwischenstand aus Cache laden
        uses: actions/cache@v4
        with:
          path: songs_mit_genre.tsv
          key: genre-progress-${{ github.run_id }}
          restore-keys: |
            genre-progress-

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Genres ermitteln
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          INPUT_FILE: Ausgabe Spotify.xlsx
          OUTPUT_FILE: songs_mit_genre.tsv
          PYTHONUNBUFFERED: "1"
        run: python -u genre_lookup.py

      - name: Ergebnis als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songs_mit_genre
          path: songs_mit_genre.tsv
          if-no-files-found: warn
